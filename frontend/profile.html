<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VizoChat - Profile</title>
  <meta
    name="description"
    content="View your VizoChat profile, valid likes and total earnings."
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        VizoChat
      </a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="chat.html">Random Chat</a>
        <a href="leaderboard.html">Top 20</a>
        <a href="help.html">Help</a>
      </nav>

    </div>
  </header>


  <main class="profile-page">

    <div class="container">

      <section class="profile-card">

        <div class="profile-photo-wrapper">
          <img
            id="profilePhoto"
            src=""
            alt="Profile photo"
            class="profile-photo"
          >
        </div>

        <h1 id="profileName">
          Loading...
        </h1>

        <p id="profileEmail">
          Loading...
        </p>


        <div class="profile-stats">

          <div class="profile-stat">
            <span class="stat-value" id="validLikes">
              0
            </span>

            <span class="stat-label">
              Valid Likes
            </span>
          </div>


          <div class="profile-stat">
            <span class="stat-value" id="totalEarnings">
              ₹0
            </span>

            <span class="stat-label">
              Total Earnings
            </span>
          </div>

        </div>


        <div
          id="profileMessage"
          class="profile-message"
        ></div>


        <div class="profile-actions">

          <a
            href="chat.html"
            class="primary-button"
          >
            Start Random Chat
          </a>

          <a
            href="leaderboard.html"
            class="secondary-button"
          >
            View Top 20
          </a>

          <button
            id="logoutButton"
            type="button"
            class="secondary-button"
          >
            Logout
          </button>

        </div>

      </section>

    </div>

  </main>


  <footer class="site-footer">

    <div class="container">

      <p>
        Need help?
        <a
          href="https://t.me/zenithvizo"
          target="_blank"
          rel="noopener noreferrer"
        >
          Telegram Support @zenithvizo
        </a>
      </p>

      <p>
        &copy;
        <span id="currentYear"></span>
        VizoChat. All rights reserved.
      </p>

    </div>

  </footer>


  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>

</body>
</html>
