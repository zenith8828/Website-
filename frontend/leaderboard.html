<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VizoChat - Top 20</title>
  <meta
    name="description"
    content="VizoChat Top 20 leaderboard based on valid Likes."
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        VizoChat
      </a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="chat.html">Random Chat</a>
        <a href="profile.html">Profile</a>
        <a href="help.html">Help</a>
      </nav>

    </div>
  </header>


  <!-- MAIN -->
  <main class="leaderboard-page">

    <div class="container">

      <section class="leaderboard-card">

        <h1>Top 20</h1>

        <p class="leaderboard-subtitle">
          Top VizoChat users based on valid Likes.
        </p>

        <div
          id="leaderboardMessage"
          class="login-message"
        >
          Loading Top 20...
        </div>

        <div
          id="leaderboardList"
          class="leaderboard-list"
        ></div>

      </section>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="container">

      <p>
        Need help?
        <a
          href="https://t.me/zenithvizo"
          target="_blank"
          rel="noopener noreferrer"
        >
          Telegram Support @zenithvizo
        </a>
      </p>

      <p>
        &copy;
        <span id="currentYear"></span>
        VizoChat. All rights reserved.
      </p>

    </div>

  </footer>


  <!-- COMMON JS -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>


  <!-- LEADERBOARD JS -->
  <script>
    "use strict";

    const LEADERBOARD_API =
      window.VizoAuth?.VIZOCHAT_API ||
      "https://website-r746.onrender.com/api";


    const leaderboardList =
      document.getElementById(
        "leaderboardList"
      );

    const leaderboardMessage =
      document.getElementById(
        "leaderboardMessage"
      );


    /* =====================================
       LOAD TOP 20
    ===================================== */

    async function loadLeaderboard() {

      try {

        const response =
          await fetch(
            `${LEADERBOARD_API}/leaderboard`,
            {
              method: "GET",
              headers: {
                "Content-Type":
                  "application/json"
              }
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {
          throw new Error(
            data.message ||
            "Unable to load leaderboard."
          );
        }


        const users =
          Array.isArray(data.leaderboard)
            ? data.leaderboard
            : Array.isArray(data.users)
              ? data.users
              : [];


        renderLeaderboard(users);


      } catch (error) {

        console.error(
          "Leaderboard error:",
          error
        );


        if (leaderboardMessage) {
          leaderboardMessage.textContent =
            error.message ||
            "Unable to load Top 20.";
        }

      }

    }


    /* =====================================
       RENDER TOP 20
    ===================================== */

    function renderLeaderboard(users) {

      if (!leaderboardList) {
        return;
      }


      leaderboardList.innerHTML = "";


      if (!users.length) {

        if (leaderboardMessage) {
          leaderboardMessage.textContent =
            "No users on the leaderboard yet.";
        }

        return;
      }


      if (leaderboardMessage) {
        leaderboardMessage.textContent = "";
      }


      const topUsers =
        users.slice(0, 20);


      topUsers.forEach(
        (user, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "leaderboard-item";


          /* Rank */
          const rank =
            document.createElement(
              "div"
            );

          rank.className =
            "leaderboard-rank";

          rank.textContent =
            `#${index + 1}`;


          /* Photo */
          const photo =
            document.createElement(
              "img"
            );

          photo.className =
            "leaderboard-photo";

          photo.alt =
            "Profile photo";


          if (user.photo) {

            photo.src =
              user.photo;

          } else {

            photo.style.display =
              "none";
          }


          /* User information */
          const info =
            document.createElement(
              "div"
            );

          info.className =
            "leaderboard-user";


          const name =
            document.createElement(
              "strong"
            );

          name.textContent =
            user.name ||
            "VizoChat User";


          const likes =
            document.createElement(
              "span"
            );

          likes.textContent =
            `${Number(
              user.validLikes || 0
            )} Valid Likes`;


          info.appendChild(name);
          info.appendChild(likes);


          /* Profile link */
          const profileLink =
            document.createElement(
              "a"
            );

          profileLink.href =
            "profile.html";

          profileLink.className =
            "leaderboard-profile-link";

          profileLink.textContent =
            "Profile";


          /* Add elements */
          item.appendChild(rank);
          item.appendChild(photo);
          item.appendChild(info);
          item.appendChild(profileLink);


          leaderboardList.appendChild(
            item
          );

        }
      );

    }


    /* =====================================
       PAGE START
    ===================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        loadLeaderboard();

      }
    );

  </script>

</body>
</html>
