<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VizoChat - Top 20</title>
  <meta
    name="description"
    content="VizoChat Top 20 leaderboard based on valid likes."
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        VizoChat
      </a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="chat.html">Random Chat</a>
        <a href="profile.html">Profile</a>
        <a href="help.html">Help</a>
      </nav>

    </div>
  </header>


  <main class="leaderboard-page">

    <div class="container">

      <section class="leaderboard-header">

        <h1>Top 20</h1>

        <p>
          Users are ranked by their valid Likes.
        </p>

      </section>


      <section class="leaderboard-card">

        <div
          id="leaderboardMessage"
          class="leaderboard-message"
        >
          Loading leaderboard...
        </div>


        <div
          id="leaderboardList"
          class="leaderboard-list"
        ></div>

      </section>


      <div class="leaderboard-actions">

        <a
          href="chat.html"
          class="primary-button"
        >
          Start Random Chat
        </a>

        <a
          href="profile.html"
          class="secondary-button"
        >
          My Profile
        </a>

      </div>

    </div>

  </main>


  <footer class="site-footer">

    <div class="container">

      <p>
        Need help?
        <a
          href="https://t.me/zenithvizo"
          target="_blank"
          rel="noopener noreferrer"
        >
          Telegram Support @zenithvizo
        </a>
      </p>

      <p>
        &copy;
        <span id="currentYear"></span>
        VizoChat. All rights reserved.
      </p>

    </div>

  </footer>


  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

  <script>
    "use strict";

    const LEADERBOARD_API =
      window.VizoAuth?.VIZOCHAT_API ||
      "http://localhost:5000/api";

    async function loadLeaderboard() {
      const message =
        document.getElementById(
          "leaderboardMessage"
        );

      const list =
        document.getElementById(
          "leaderboardList"
        );

      try {
        const response =
          await fetch(
            `${LEADERBOARD_API}/leaderboard`
          );

        const data =
          await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message ||
            "Unable to load leaderboard."
          );
        }

        list.innerHTML = "";

        if (
          !Array.isArray(data.users) ||
          data.users.length === 0
        ) {
          message.textContent =
            "No users have valid Likes yet.";

          return;
        }

        message.textContent =
          `Top ${data.users.length} users`;

        data.users.forEach((user) => {
          const item =
            document.createElement("div");

          item.className =
            "leaderboard-item";

          const photo =
            document.createElement("img");

          photo.className =
            "leaderboard-photo";

          photo.alt =
            `${user.name || "User"} profile photo`;

          if (user.photo) {
            photo.src = user.photo;
          } else {
            photo.style.display = "none";
          }

          const rank =
            document.createElement("span");

          rank.className =
            "leaderboard-rank";

          rank.textContent =
            `#${user.rank}`;

          const name =
            document.createElement("span");

          name.className =
            "leaderboard-name";

          name.textContent =
            user.name || "VizoChat User";

          const likes =
            document.createElement("span");

          likes.className =
            "leaderboard-likes";

          likes.textContent =
            `${Number(
              user.validLikes || 0
            )} Valid Likes`;

          item.appendChild(rank);
          item.appendChild(photo);
          item.appendChild(name);
          item.appendChild(likes);

          list.appendChild(item);
        });

      } catch (error) {
        console.error(
          "Leaderboard error:",
          error
        );

        message.textContent =
          error.message ||
          "Unable to load leaderboard.";

        list.innerHTML = "";
      }
    }

    document.addEventListener(
      "DOMContentLoaded",
      loadLeaderboard
    );
  </script>

</body>
</html>
