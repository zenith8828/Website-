<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>VizoChat - Random Video Chat</title>

  <link rel="stylesheet" href="css/style.css?v=12" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050816;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      touch-action: pan-y;
    }

    .chat-page {
      width: 100%;
      height: 100svh;
      min-height: 0;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(0, 204, 255, 0.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(255, 0, 170, 0.08),
          transparent 30%
        ),
        #050816;
    }

    .chat-main {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .video-area {
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      padding: 10px;
      overflow: hidden;
      touch-action: pan-y;
    }

    .video-grid {
      width: 100%;
      height: 100%;
      min-height: 0;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-box {
      position: relative;
      width: 100%;
      height: calc(50% - 5px);
      min-height: 0;

      overflow: hidden;

      border-radius: 18px;

      background: #080d1f;

      border: 2px solid rgba(0, 204, 255, 0.85);

      box-shadow:
        0 0 10px rgba(0, 204, 255, 0.65),
        inset 0 0 20px rgba(0, 204, 255, 0.05);
    }

    .video-box.remote {
      border-color: rgba(0, 204, 255, 0.9);

      box-shadow:
        0 0 14px rgba(0, 204, 255, 0.7),
        inset 0 0 20px rgba(0, 204, 255, 0.06);
    }

    .video-box.local {
      border-color: rgba(255, 0, 180, 0.9);

      box-shadow:
        0 0 14px rgba(255, 0, 180, 0.65),
        inset 0 0 20px rgba(255, 0, 180, 0.06);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;

      object-fit: cover;

      background: #080d1f;
    }

    #localVideo {
      transform: scaleX(-1);
    }

    .video-placeholder {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;

      gap: 10px;

      text-align: center;

      padding: 20px;

      color: #dce8ff;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 204, 255, 0.08),
          transparent 55%
        ),
        #080d1f;

      z-index: 2;
    }

    .video-placeholder.hidden {
      display: none;
    }

    .placeholder-icon {
      font-size: 38px;

      filter:
        drop-shadow(
          0 0 10px rgba(0, 204, 255, 0.7)
        );
    }

    .placeholder-title {
      font-size: 16px;
      font-weight: 700;
    }

    .placeholder-text {
      color: #8e9bb9;

      font-size: 13px;

      max-width: 260px;

      line-height: 1.5;
    }

    /* TOP ACTIONS */

    .top-actions {
      position: absolute;

      top: 12px;
      right: 12px;

      display: flex;

      gap: 8px;

      z-index: 10;
    }

    .action-button {
      min-width: 42px;
      height: 42px;

      padding: 0 13px;

      border:
        1px solid rgba(255, 255, 255, 0.18);

      border-radius: 12px;

      color: #fff;

      background:
        rgba(5, 8, 22, 0.78);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .action-button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .report-button {
      border-color:
        rgba(255, 80, 100, 0.55);

      box-shadow:
        0 0 10px rgba(255, 80, 100, 0.2);
    }

    .report-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* LIKE */

    .like-wrapper {
      position: absolute;

      right: 14px;
      bottom: 14px;

      z-index: 10;
    }

    #likeBtn {
      width: 52px;
      height: 52px;

      border:
        1px solid rgba(255, 70, 170, 0.8);

      border-radius: 50%;

      color: #fff;

      background:
        rgba(10, 8, 25, 0.82);

      box-shadow:
        0 0 12px rgba(255, 0, 180, 0.55),
        inset 0 0 12px rgba(255, 0, 180, 0.08);

      font-size: 23px;

      cursor: pointer;
    }

    #likeBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* =========================================
       CHAT / CAMERA / COIN
       VIDEO AREA KE ANDAR
       ========================================= */

    .local-controls {
      position: absolute;

      left: 50%;

      /*
       * Controls video-area ke andar rahenge
       * aur bottom navigation ke upar rahenge.
       */
      bottom:
        calc(
          env(safe-area-inset-bottom, 0px) + 18px
        );

      transform: translateX(-50%);

      z-index: 30;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      padding: 9px 12px;

      border-radius: 18px;

      background:
        rgba(4, 7, 20, 0.82);

      border:
        1px solid rgba(0, 204, 255, 0.30);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 0 18px rgba(0, 0, 0, 0.35),
        0 0 15px rgba(0, 204, 255, 0.08);
    }

    .control-button {
      width: 48px;
      height: 48px;

      border:
        1px solid rgba(255, 255, 255, 0.15);

      border-radius: 14px;

      background:
        rgba(13, 18, 40, 0.9);

      color: #fff;

      font-size: 21px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .control-button:hover {
      transform: translateY(-2px);
    }

    .control-button.active {
      border-color:
        rgba(0, 220, 255, 0.85);

      box-shadow:
        0 0 12px rgba(0, 220, 255, 0.45);
    }

    .control-button.camera-off {
      border-color:
        rgba(255, 70, 100, 0.8);

      box-shadow:
        0 0 12px rgba(255, 70, 100, 0.35);
    }

    .control-button.coin {
      border-color:
        rgba(255, 200, 60, 0.65);

      box-shadow:
        0 0 10px rgba(255, 200, 60, 0.2);
    }

    /* STATUS */

    .status {
      position: absolute;

      left: 50%;
      top: 12px;

      transform: translateX(-50%);

      z-index: 15;

      min-width: 150px;

      max-width:
        calc(100% - 190px);

      padding: 9px 16px;

      text-align: center;

      border-radius: 999px;

      color: #dffaff;

      background:
        rgba(4, 9, 25, 0.78);

      border:
        1px solid rgba(0, 204, 255, 0.3);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      font-size: 13px;

      font-weight: 700;

      box-shadow:
        0 0 12px rgba(0, 204, 255, 0.16);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .timer,
    .guest-counter {
      display: none !important;
    }

    /* CHAT PANEL */

    .chat-panel {
      position: absolute;

      left: 50%;

      bottom: 88px;

      transform:
        translateX(-50%)
        translateY(20px);

      width:
        min(430px, calc(100% - 24px));

      height:
        min(430px, 48dvh);

      z-index: 50;

      display: flex;

      flex-direction: column;

      overflow: hidden;

      border-radius: 20px;

      background:
        rgba(6, 10, 28, 0.97);

      border:
        1px solid rgba(0, 204, 255, 0.45);

      box-shadow:
        0 0 25px rgba(0, 204, 255, 0.2),
        0 15px 45px rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      opacity: 0;

      pointer-events: none;

      transition: 0.22s ease;
    }

    .chat-panel.open {
      transform:
        translateX(-50%)
        translateY(0);

      opacity: 1;

      pointer-events: auto;
    }

    .chat-header {
      height: 52px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 14px 0 17px;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.08);
    }

    .chat-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    .chat-close {
      width: 34px;
      height: 34px;

      border: 0;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.08);

      color: #fff;

      font-size: 18px;

      cursor: pointer;
    }

    .chat-messages {
      flex: 1;

      overflow-y: auto;

      padding: 14px;

      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .chat-empty {
      margin: auto;

      text-align: center;

      color: #7f8ba8;

      font-size: 13px;

      line-height: 1.5;
    }

    .chat-message {
      max-width: 80%;

      padding: 9px 12px;

      border-radius: 14px;

      font-size: 13px;

      line-height: 1.4;

      word-break: break-word;
    }

    .chat-message.me {
      align-self: flex-end;

      background:
        rgba(0, 190, 255, 0.16);

      border:
        1px solid rgba(0, 204, 255, 0.3);
    }

    .chat-message.partner {
      align-self: flex-start;

      background:
        rgba(255, 0, 170, 0.13);

      border:
        1px solid rgba(255, 0, 170, 0.25);
    }

    .chat-form {
      display: flex;

      gap: 8px;

      padding: 10px;

      border-top:
        1px solid rgba(255, 255, 255, 0.08);
    }

    .chat-input {
      flex: 1;

      min-width: 0;

      height: 42px;

      padding: 0 13px;

      border-radius: 12px;

      outline: none;

      border:
        1px solid rgba(255, 255, 255, 0.12);

      background:
        rgba(255, 255, 255, 0.05);

      color: #fff;

      font-size: 13px;
    }

    .chat-input::placeholder {
      color: #68748e;
    }

    .chat-send {
      width: 48px;
      height: 42px;

      border:
        1px solid rgba(0, 204, 255, 0.55);

      border-radius: 12px;

      background:
        rgba(0, 180, 255, 0.12);

      color: #fff;

      font-size: 18px;

      cursor: pointer;
    }

    .chat-send:disabled,
    .chat-input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .swipe-hint {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      z-index: 8;

      pointer-events: none;

      opacity: 0;

      color:
        rgba(255, 255, 255, 0.6);

      font-size: 12px;

      transition:
        opacity 0.25s ease;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      .chat-page {
        height: 100svh;
        min-height: 0;
      }

      .chat-main {
        height: 100%;
        min-height: 0;
      }

      .video-area {
        height: 100%;
        min-height: 0;
        padding: 7px;
      }

      .video-grid {
        height: 100%;
        min-height: 0;
        gap: 7px;
      }

      .video-box {
        height: calc(50% - 3.5px);
        min-height: 0;
        border-radius: 14px;
      }

      .top-actions {
        top: 9px;
        right: 9px;
      }

      .action-button {
        height: 38px;

        min-width: 38px;

        padding: 0 10px;

        font-size: 12px;
      }

      .status {
        top: 9px;

        max-width: 42%;

        font-size: 11px;

        padding: 8px 11px;
      }

      /*
       * IMPORTANT
       *
       * Chat / Camera / Coin
       * lower video box ke andar
       * bottom navigation ke upar.
       */

      .local-controls {
        left: 50%;

        bottom:
          calc(
            env(safe-area-inset-bottom, 0px) + 16px
          );

        gap: 7px;

        padding: 7px 9px;

        border-radius: 15px;
      }

      .control-button {
        width: 43px;
        height: 43px;

        font-size: 19px;

        border-radius: 12px;
      }

      .like-wrapper {
        right: 9px;
        bottom: 10px;
      }

      #likeBtn {
        width: 46px;
        height: 46px;

        font-size: 20px;
      }

      .chat-panel {
        bottom: 76px;

        height: 52dvh;
      }
    }

    /* SMALL MOBILE */

    @media (max-width: 380px) {

      .video-area {
        padding: 6px;
      }

      .video-grid {
        gap: 6px;
      }

      .video-box {
        height: calc(50% - 3px);
        border-radius: 12px;
      }

      .local-controls {
        bottom:
          calc(
            env(safe-area-inset-bottom, 0px) + 14px
          );

        gap: 5px;

        padding: 6px 7px;
      }

      .control-button {
        width: 41px;
        height: 40px;

        font-size: 18px;
      }

      .top-actions {
        top: 7px;
        right: 7px;
      }

      .action-button {
        min-width: 37px;

        height: 35px;

        padding: 0 7px;

        font-size: 11px;
      }

      .like-wrapper {
        right: 8px;
        bottom: 8px;
      }

      #likeBtn {
        width: 43px;
        height: 43px;
      }

      .chat-panel {
        bottom: 70px;
      }
    }
  </style>
</head>

<body>

  <main class="chat-page">

    <section class="chat-main">

      <div class="video-area" id="videoArea">

        <div class="video-grid">

          <!-- =========================
               REMOTE VIDEO
               ========================= -->

          <div class="video-box remote">

            <video
              id="remoteVideo"
              autoplay
              playsinline
              muted
            ></video>

            <div
              class="video-placeholder"
              id="remotePlaceholder"
            >

              <div class="placeholder-icon">
                🔎
              </div>

              <div class="placeholder-title">
                Looking for someone...
              </div>

              <div class="placeholder-text">
                Please wait while VizoChat finds a random person for you.
              </div>

            </div>

            <!-- REPORT -->

            <div class="top-actions">

              <button
                type="button"
                id="reportBtn"
                class="action-button report-button"
                disabled
              >
                ⚠️ Report
              </button>

            </div>

            <!-- LIKE -->

            <div class="like-wrapper">

              <button
                type="button"
                id="likeBtn"
                disabled
                title="Like"
              >
                ❤️
              </button>

            </div>

          </div>


          <!-- =========================
               LOCAL VIDEO
               ========================= -->

          <div class="video-box local">

            <video
              id="localVideo"
              autoplay
              playsinline
              muted
            ></video>

            <div
              class="video-placeholder"
              id="localPlaceholder"
            >

              <div class="placeholder-icon">
                📷
              </div>

              <div class="placeholder-title">
                Starting camera...
              </div>

              <div class="placeholder-text">
                Allow camera and microphone access to start chatting.
              </div>

            </div>


            <!--
              CHAT / CAMERA / COIN
              LOWER VIDEO BOX KE ANDAR
            -->

            <div class="local-controls">

              <!-- CHAT -->

              <button
                type="button"
                id="chatBtn"
                class="control-button"
                title="Chat"
              >
                💬
              </button>


              <!-- CAMERA -->

              <button
                type="button"
                id="cameraBtn"
                class="control-button active"
                title="Camera"
              >
                📷
              </button>


              <!-- COIN -->

              <button
                type="button"
                id="coinBtn"
                class="control-button coin"
                title="Coins"
              >
                🪙
              </button>


              <!-- MICROPHONE HIDDEN -->

              <button
                type="button"
                id="micBtn"
                class="control-button"
                title="Microphone"
                style="display:none;"
              >
                🎤
              </button>

            </div>

          </div>

        </div>


        <!-- SWIPE -->

        <div
          class="swipe-hint"
          id="swipeHint"
        >
          Swipe to meet someone else
        </div>


        <!-- STATUS -->

        <div
          class="status"
          id="status"
        >
          Starting camera...
        </div>


        <!-- TIMER -->

        <div
          class="timer"
          id="timer"
        >
          00:00
        </div>


        <!-- GUEST COUNTER -->

        <div
          class="guest-counter"
          id="guestCounter"
        ></div>


        <!-- =========================
             CHAT PANEL
             ========================= -->

        <div
          class="chat-panel"
          id="chatPanel"
        >

          <div class="chat-header">

            <div class="chat-title">
              💬 Chat
            </div>

            <button
              type="button"
              class="chat-close"
              id="chatCloseBtn"
              aria-label="Close chat"
            >
              ×
            </button>

          </div>


          <div
            class="chat-messages"
            id="chatMessages"
          >

            <div
              class="chat-empty"
              id="chatEmpty"
            >
              Say hello 👋
            </div>

          </div>


          <form
            class="chat-form"
            id="chatForm"
          >

            <input
              type="text"
              id="chatInput"
              class="chat-input"
              maxlength="500"
              autocomplete="off"
              placeholder="Type a message..."
              disabled
            />

            <button
              type="submit"
              id="chatSendBtn"
              class="chat-send"
              disabled
            >
              ➤
            </button>

          </form>

        </div>

      </div>

    </section>

  </main>


  <!-- APP -->

  <script src="js/app.js?v=12"></script>


  <!-- AUTH -->

  <script src="js/auth.js?v=12"></script>


  <!-- SOCKET.IO -->

  <script
    src="https://cdn.socket.io/4.8.1/socket.io.min.js"
    crossorigin="anonymous"
  ></script>


  <!-- LIKE -->

  <script src="js/like.js?v=12"></script>


  <!-- CHAT -->

  <script src="js/chat.js?v=13"></script>

</body>
</html>
