<script src="./js/app.js?v=3"></script>
<script src="./js/auth.js?v=3"></script>
<script src="./js/like.js?v=3"></script>
<script src="./js/chat.js?v=3"></script>

<script>
  window.addEventListener("error", function (event) {
    const box = document.getElementById("status");

    if (box) {
      box.textContent =
        "JavaScript Error: " +
        (event.message || "Unknown error");
    }

    console.error("VizoChat page error:", event.error);
  });

  window.addEventListener("load", function () {
    setTimeout(function () {
      if (!window.VizoChat) {
        const box = document.getElementById("status");

        if (box) {
          box.textContent =
            "VizoChat chat.js load nahi hua. Please reload.";
        }

        console.error(
          "VizoChat: window.VizoChat is missing."
        );
      }
    }, 1500);
  });
</script>
